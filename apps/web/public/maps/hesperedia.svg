<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <radialGradient id="oceanGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0C3A6A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </radialGradient>
    <radialGradient id="landGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A2E10"/>
      <stop offset="100%" stop-color="#3D2510"/>
    </radialGradient>
  </defs>

  <!-- Ocean background -->
  <rect width="1000" height="800" fill="url(#oceanGrad)"/>

  <!-- Main continent — Hesperedia -->
  <path d="M 120,60 L 680,50 L 720,100 L 700,200 L 660,280 L 700,380 L 680,500 L 640,580 L 500,620 L 380,610 L 260,580 L 180,520 L 100,440 L 80,320 L 90,200 Z"
    fill="url(#landGrad)" stroke="#6A5038" stroke-width="2" opacity="0.9"/>

  <!-- Hwitland archipelago -->
  <ellipse cx="160" cy="95" rx="80" ry="50" fill="#4A2E10" stroke="#6A5038" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="110" cy="130" rx="45" ry="30" fill="#3D2510" stroke="#6A5038" stroke-width="1" opacity="0.8"/>
  <ellipse cx="230" cy="75" rx="35" ry="20" fill="#3D2510" stroke="#6A5038" stroke-width="1" opacity="0.8"/>

  <!-- Einmark highlands texture -->
  <path d="M 490,80 L 560,90 L 650,90 L 660,140 L 650,200 L 600,240 L 530,230 L 490,190 L 480,140 Z"
    fill="#5E3D1A" stroke="#78532A" stroke-width="1.5" opacity="0.7"/>

  <!-- Hieria plateau -->
  <ellipse cx="405" cy="355" rx="55" ry="45" fill="#7A5A00" stroke="#D4A017" stroke-width="2" opacity="0.6"/>

  <!-- Bagrania (blighted lands) -->
  <path d="M 500,260 L 660,260 L 670,380 L 640,460 L 550,470 L 490,420 L 480,350 Z"
    fill="#4A0010" stroke="#C41E3A" stroke-width="1.5" opacity="0.5"/>

  <!-- Belvento coast -->
  <path d="M 280,470 L 450,460 L 460,560 L 420,590 L 350,600 L 270,570 Z"
    fill="#0C3A6A" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>

  <!-- Rivers -->
  <path d="M 400,120 Q 410,200 400,280 Q 390,350 405,355" stroke="#0284C7" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 550,150 Q 530,250 520,350 Q 510,400 500,450" stroke="#0284C7" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Mountain ranges (simplified) -->
  <g stroke="#8B7050" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 320,150 L 340,130 L 360,150 M 370,145 L 390,125 L 410,145"/>
    <path d="M 520,120 L 540,100 L 560,120 M 570,115 L 590,95 L 610,115"/>
    <path d="M 200,300 L 220,280 L 240,300 M 250,295 L 270,275 L 290,295"/>
  </g>

  <!-- Forest dots -->
  <g fill="#5E3D1A" opacity="0.5">
    <circle cx="300" cy="250" r="8"/><circle cx="320" cy="240" r="6"/><circle cx="280" cy="260" r="7"/>
    <circle cx="450" cy="300" r="8"/><circle cx="470" cy="290" r="6"/><circle cx="430" cy="310" r="7"/>
  </g>

  <!-- Contamination zone (Bagrania) -->
  <ellipse cx="590" cy="380" rx="70" ry="60" fill="#C41E3A" opacity="0.08"/>

  <!-- Orla void hint (top-right) -->
  <radialGradient id="orlaGrad" cx="90%" cy="10%">
    <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="1000" height="800" fill="url(#orlaGrad)"/>

  <!-- Labels -->
  <g font-family="serif" fill="#D4BC8B" opacity="0.7">
    <text x="380" y="290" font-size="14" text-anchor="middle" font-style="italic">Anthoresia</text>
    <text x="160" y="95" font-size="11" text-anchor="middle" font-style="italic">Hwitland</text>
    <text x="575" y="180" font-size="11" text-anchor="middle" font-style="italic">Einmark</text>
    <text x="355" y="540" font-size="11" text-anchor="middle" font-style="italic">Belvento</text>
    <text x="575" y="360" font-size="10" text-anchor="middle" font-style="italic" fill="#F87171">Bagrania</text>
    <text x="405" y="358" font-size="9" text-anchor="middle" fill="#D4A017">Hieria</text>
  </g>

  <!-- Aurean Sea label -->
  <text x="200" y="680" font-family="serif" font-size="16" fill="#7EC8E3" opacity="0.4" font-style="italic" text-anchor="middle">Mer Auréenne</text>
  <text x="850" y="400" font-family="serif" font-size="13" fill="#7EC8E3" opacity="0.3" font-style="italic" text-anchor="middle">Mer de l'Orla</text>

  <!-- Compass rose -->
  <g transform="translate(920, 720)" opacity="0.5">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#D4BC8B" stroke-width="1"/>
    <text x="0" y="-14" font-family="serif" font-size="11" fill="#D4BC8B" text-anchor="middle">N</text>
    <text x="0" y="20" font-family="serif" font-size="9" fill="#D4BC8B" text-anchor="middle">S</text>
    <text x="18" y="4" font-family="serif" font-size="9" fill="#D4BC8B" text-anchor="middle">E</text>
    <text x="-18" y="4" font-family="serif" font-size="9" fill="#D4BC8B" text-anchor="middle">O</text>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#D4BC8B" stroke-width="0.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#D4BC8B" stroke-width="0.5"/>
  </g>
</svg>
